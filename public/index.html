    <h1>sysweb is serving this page.</h1>
    <p>Written in Rust with <code>#![no_std]</code>, no allocator, no third-party crates,
       and no libc calls. On Linux it links no libc at all; on macOS it makes raw BSD
       syscalls and imports no libSystem symbols.</p>
