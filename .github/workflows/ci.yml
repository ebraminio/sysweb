name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Dependency policy
        run: ./scripts/check-no-deps.sh

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (debug)
        run: cargo test

      # Release builds are not optional: this catches LLVM libcall
      # canonicalization bugs (see the bzero/LTO story in ARCHITECTURE.md)
      # that do not reproduce in debug builds.
      - name: Tests (release + LTO)
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release

      - name: Verify no external runtime dependencies
        run: ./scripts/check-binary.sh target/release/syswebd

  fuzz-smoke:
    name: fuzz smoke (libFuzzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Build fuzzers
        run: cargo fuzz build

      - name: Run fuzz targets
        run: |
          for target in http path multipart; do
            echo "::group::fuzz $target"
            cargo fuzz run "$target" "fuzz/seeds/$target" -- -timeout=5 -max_total_time=20 -rss_limit_mb=2048
            echo "::endgroup::"
          done

  linux-aarch64-check:
    name: check (linux aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Type-check the aarch64 syscall backend
        run: cargo check --target aarch64-unknown-linux-gnu
