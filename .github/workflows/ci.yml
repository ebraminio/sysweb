name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --all -- --check

      - name: Dependency policy
        run: ./scripts/check-no-deps.sh

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (debug)
        run: cargo test

      # Release builds are not optional: this catches LLVM libcall
      # canonicalization bugs (see the bzero/LTO story in ARCHITECTURE.md)
      # that do not reproduce in debug builds.
      - name: Tests (release + LTO)
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release

      - name: Verify no external runtime dependencies
        run: ./scripts/check-binary.sh target/release/syswebd

  linux-aarch64-check:
    name: check (linux aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Type-check the aarch64 syscall backend
        run: cargo check --target aarch64-unknown-linux-gnu
