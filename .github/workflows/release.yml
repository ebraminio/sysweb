name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          # Native arm64 runner; available for public repositories.
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
          - runner: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install lld (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Tests (release + LTO)
        if: matrix.target != 'x86_64-pc-windows-msvc'
        run: cargo test --release --target ${{ matrix.target }} -- --test-threads=1

      - name: Relink release with lld (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo rustc --release --target ${{ matrix.target }} --bin syswebd -- -C linker=ld.lld

      - name: Verify no external runtime dependencies
        if: matrix.target != 'x86_64-pc-windows-msvc'
        run: ./scripts/check-binary.sh target/${{ matrix.target }}/release/syswebd

      - name: Verify binary size budget
        if: matrix.target != 'x86_64-pc-windows-msvc'
        run: ./scripts/check-size.sh target/${{ matrix.target }}/release/syswebd

      - name: Verify Windows binary size
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          size="$(wc -c < target/x86_64-pc-windows-msvc/release/syswebd.exe)"
          test "$size" -le 118784
          echo "windows size: $size B <= 118784 B"

      - name: Windows smoke test
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -Exe target/x86_64-pc-windows-msvc/release/syswebd.exe

      - name: Inspect Windows imports
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: ./scripts/check-windows-imports.ps1 -Exe target/x86_64-pc-windows-msvc/release/syswebd.exe

      - name: Package raw binary
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            asset="sysweb-${{ matrix.platform }}.exe"
            cp "target/${{ matrix.target }}/release/syswebd.exe" "dist/${asset}"
          else
            asset="sysweb-${{ matrix.platform }}"
            cp "target/${{ matrix.target }}/release/syswebd" "dist/${asset}"
            chmod +x "dist/${asset}"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  release:
    name: publish per-commit release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          short="${GITHUB_SHA:0:12}"
          tag="build-${short}"
          title="Build ${short}"
          notes="Automated per-commit build of ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}. Downloads are raw binaries with stable platform names; run chmod +x on Unix. See the README for the platform matrix."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --latest
          else
            gh release create "$tag" dist/* \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --latest
          fi
